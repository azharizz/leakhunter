[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakhunter"
version = "0.2.0"
description = "Policy-aware exposure analysis and independent synthetic repair verification"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25", "tree-sitter-typescript>=0.23", "tree-sitter-go>=0.25", "tree-sitter-rust>=0.24"]

[project.scripts]
leakhunter = "leakhunter.app:main"

[tool.setuptools.packages.find]
include = ["leakhunter*"]
namespaces = true

[tool.setuptools.package-data]
leakhunter = ["static/*.html", "static/*.css", "static/*.js"]
