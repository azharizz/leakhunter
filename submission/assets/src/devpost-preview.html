<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unspool Devpost preview (3:2, made for a small thumbnail)</title>
<style>
@font-face { font-family: "Instrument Serif"; src: url(FONTS/InstrumentSerif-Italic.ttf); font-style: italic; }
@font-face { font-family: "JB"; src: url(FONTS/JetBrainsMono.ttf); font-weight: 100 900; }
:root { --night: #0E110D; --ink: #EEF3EA; --thread: #28765A; --glow: #3DDC97; --leak: #E5483E; --duo: #FC6D26;
  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; --mono: "JB", ui-monospace, monospace; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1500px; height: 1000px; overflow: hidden; }
body { position: relative; background: radial-gradient(ellipse at 30% 25%, #1d2a1e 0%, var(--night) 66%); color: var(--ink); font-family: var(--sf); -webkit-font-smoothing: antialiased; }
.lockup { position: absolute; left: 96px; top: 84px; display: flex; align-items: center; gap: 34px; }
.tile { width: 150px; height: 150px; border-radius: 38px; background: #20251f; border: 3px solid #3a4637; padding: 19px; }
.word { font: 800 132px/1 var(--sf); letter-spacing: -.04em; }
.head { position: absolute; left: 100px; top: 300px; font: 800 118px/1.02 var(--sf); letter-spacing: -.045em; }
.head em { display: block; font: italic 400 138px/1 "Instrument Serif", serif; color: var(--glow); letter-spacing: -.01em; }
.steps { position: absolute; left: 96px; right: 96px; bottom: 92px; display: flex; align-items: center; gap: 26px; }
.step { flex: 1; height: 150px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font: 800 78px/1 var(--mono); letter-spacing: .04em; border: 6px solid; }
.prove { color: #ff8a80; border-color: var(--leak); background: rgba(229,72,62,.12); }
.fix { color: #ffb38a; border-color: var(--duo); background: rgba(252,109,38,.12); }
.ship { color: var(--night); border-color: var(--glow); background: var(--glow); }
.arrow { flex: none; font: 800 70px/1 var(--sf); color: #6d7a6a; }
</style>
</head>
<body>
<div class="lockup">
  <div class="tile"><svg viewBox="0 0 32 32" width="106" height="106" style="display:block;fill:#fff"><path d="M8 9v14h16M8 16h8l8-7M16 16l8 7" fill="none" stroke="#fff" stroke-width="2"/><circle cx="8" cy="9" r="2"/><circle cx="24" cy="9" r="2"/><circle cx="24" cy="23" r="2"/></svg></div>
  <div class="word">Unspool</div>
</div>
<div class="head">One push.<em>GitLab Duo fixes the leak.</em></div>
<div class="steps">
  <div class="step prove">PROVE</div><div class="arrow">→</div>
  <div class="step fix">FIX</div><div class="arrow">→</div>
  <div class="step ship">SHIP</div>
</div>
</body>
</html>
