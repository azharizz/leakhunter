[build-system]
requires = ["setuptools==83.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unspool"
version = "0.4.4"
license = {text = "MIT"}
description = "Policy-aware exposure analysis and independent synthetic repair verification"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25", "tree-sitter-typescript>=0.23", "tree-sitter-go>=0.25", "tree-sitter-rust>=0.24"]

[project.scripts]
unspool = "leakhunter.app:main"
leakhunter = "leakhunter.app:main"
unspool-handoff = "unspool.handoff:main"

[tool.setuptools.packages.find]
include = ["leakhunter*", "unspool*"]
namespaces = true

[tool.setuptools.package-data]
leakhunter = ["static/*.html", "static/*.css", "static/*.js"]
