stages: [build, verify, evidence, sign, verify-attestation, deploy, monitor]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true

.python-bootstrap:
  before_script:
    - python -m pip install --disable-pip-version-check --upgrade -r requirements.build.lock

python-tests:
  extends: .python-bootstrap
  stage: verify
  image: python:3.12
  script:
    - pip install --disable-pip-version-check -c requirements.lock .
    - python -m unittest discover -s tests -v

dashboard-tests:
  stage: verify
  image: node:22-slim
  script:
    - node --check unspool/static/app.js
    - node tests/test_dashboard.cjs

security-audit:
  extends: .python-bootstrap
  stage: verify
  image: python:3.12-slim
  script:
    - python -m pip install --disable-pip-version-check -c requirements.build.lock -r requirements.audit.lock
    - python ci/security_audit.py
  artifacts:
    when: always
    paths: [security-reports/]
    expire_in: 90 days

build-wheel:
  extends: .python-bootstrap
  stage: build
  image: python:3.12-slim
  script:
    - |
      export SOURCE_DATE_EPOCH="$(python -c 'import datetime, os; print(int(datetime.datetime.fromisoformat(os.environ["CI_COMMIT_TIMESTAMP"].replace("Z", "+00:00")).timestamp()))')"
    - python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir dist .
    - sha256sum dist/*.whl > wheel-sha256.txt
    - |
      python -c 'import json, os, platform; from importlib.metadata import version; print(json.dumps({"source_commit": os.environ["CI_COMMIT_SHA"], "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]), "builder_python": platform.python_version(), "build_tools": {name: version(name) for name in ("pip", "setuptools", "wheel", "packaging")}}))' > wheel-build.json
  artifacts:
    paths: [dist/, wheel-sha256.txt, wheel-build.json]
    expire_in: 90 days

installed-wheel:
  extends: .python-bootstrap
  stage: verify
  image: python:${PYTHON_VERSION}-slim
  needs: [build-wheel]
  parallel:
    matrix:
      - PYTHON_VERSION: ['3.10', '3.12']
  script:
    - sha256sum -c wheel-sha256.txt
    - python -m pip install --disable-pip-version-check -c requirements.lock dist/unspool-*.whl
    - python -m pip check
    - cd /tmp
    - python -I "$CI_PROJECT_DIR/ci/verify_install.py" --source "$CI_PROJECT_DIR" --output "$CI_PROJECT_DIR/installation.json"
    - python -m pip freeze > "$CI_PROJECT_DIR/installed-dependencies.txt"
    - cd "$CI_PROJECT_DIR"
    - sha256sum -c wheel-sha256.txt
  artifacts:
    when: always
    paths: [dist/, installation.json, installed-dependencies.txt, wheel-sha256.txt, wheel-build.json]
    expire_in: 90 days

verify-exposure:
  extends: .python-bootstrap
  stage: evidence
  image: python:3.12-slim
  # Produce exposure evidence even when another verify job fails.
  needs: []
  variables:
    GIT_DEPTH: "0"
    GCP_PROJECT_NUMBER: "398376578726"
    GCP_WORKLOAD_IDENTITY_FEDERATION_POOL_ID: unspool-exposure-ci
    GCP_WORKLOAD_IDENTITY_FEDERATION_PROVIDER_ID: gitlab-mr
    AGENT_PROVIDER_URL: https://openrouter.ai/api/v1/chat/completions
    AGENT_PROVIDER_MODEL: openai/gpt-6-luna-decisions
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GCP_WORKLOAD_IDENTITY_FEDERATION_POOL_ID}/providers/${GCP_WORKLOAD_IDENTITY_FEDERATION_PROVIDER_ID}
  secrets:
    AGENT_PROVIDER_API_KEY:
      gcp_secret_manager:
        name: projects/398376578726/secrets/unspool-agent-provider-key
      token: $GCP_ID_TOKEN
      file: false
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git tar
    - python -m pip install --disable-pip-version-check --upgrade -r requirements.build.lock
  script:
    - pip install --disable-pip-version-check -c requirements.lock .
    - |
      set -eu
      base_sha=""
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        base_sha="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        base_sha="$CI_COMMIT_BEFORE_SHA"
      fi
      if [ -n "$base_sha" ] && [ "$base_sha" != "0000000000000000000000000000000000000000" ]; then
        mkdir -p /tmp/unspool-base
        git archive "$base_sha" | tar -x -C /tmp/unspool-base
        # Run the same fixed synthetic manifest against the exact base and head trees.
        python -m unspool --repository /tmp/unspool-base/demo/target --policy /tmp/unspool-base/demo/policy.yaml --runtime-manifest /tmp/unspool-base/demo/runtime.yaml --runtime-backend local --data-dir /tmp/unspool-base-data --once analyze > base-evidence.json
        python -m unspool diff --repository "$CI_PROJECT_DIR" --target-directory demo/target --policy "$CI_PROJECT_DIR/demo/policy.yaml" --manifest "$CI_PROJECT_DIR/demo/runtime.yaml" --base "$base_sha" --head "$CI_COMMIT_SHA" --output unspool-diff
        python -m unspool --repository demo/target --policy demo/policy.yaml --runtime-manifest demo/runtime.yaml --runtime-backend local --data-dir /tmp/unspool-head-data --once analyze > head-evidence.json
        unspool-bind-closed-loop-evidence --diff unspool-diff/exposure-diff.json --base-evidence base-evidence.json --head-evidence head-evidence.json --base-sha "$base_sha" --head-sha "$CI_COMMIT_SHA" --output evidence.json --sast-output unspool-diff/gl-sast-report.json --note-output mr-note.md
        python -m unspool.attestation prepare --evidence evidence.json --base-sha "$base_sha" --head-sha "$CI_COMMIT_SHA" --output attestation.statement.json
      else
        # Non-MR feature branches still get the existing bounded synthetic gate.
        python -m unspool --repository demo/target --policy demo/policy.yaml --runtime-manifest demo/runtime.yaml --runtime-backend local --data-dir /tmp/unspool-demo --once analyze --gate > evidence.json
        python - <<'PY'
      import json
      from pathlib import Path
      from unspool.exposure_diff import sast_report
      Path("unspool-diff").mkdir(exist_ok=True)
      Path("unspool-diff/gl-sast-report.json").write_text(json.dumps(sast_report([])) + "\n")
      PY
      fi
      python -m unspool.publish --evidence evidence.json --output public --commit "$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths: [evidence.json, base-evidence.json, head-evidence.json, attestation.statement.json, mr-note.md, unspool-diff/, public/]
    reports:
      sast: unspool-diff/gl-sast-report.json
    expire_in: 90 days

sign-evidence:
  stage: sign
  image: alpine:3.22
  interruptible: false
  needs:
    - job: verify-exposure
      artifacts: true
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apk add --no-cache cosign
  script:
    - test "$CI_COMMIT_REF_PROTECTED" = "true"
    - test -f attestation.statement.json
    - cosign sign-blob --yes --bundle attestation.bundle.json attestation.statement.json
  artifacts:
    paths: [attestation.bundle.json]
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'

verify-attestation:
  stage: verify-attestation
  image: python:3.12-alpine
  interruptible: false
  needs:
    - job: verify-exposure
      artifacts: true
    - job: sign-evidence
      artifacts: true
  before_script:
    - apk add --no-cache cosign
  script:
    - test "$CI_COMMIT_REF_PROTECTED" = "true"
    - python -m unspool.attestation verify --evidence evidence.json --statement attestation.statement.json --bundle attestation.bundle.json --expected-identity "$CI_PROJECT_URL//.gitlab-ci.yml@refs/heads/$CI_COMMIT_REF_NAME" --expected-head-sha "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'

deploy-pages:
  stage: deploy
  interruptible: false
  resource_group: production
  needs:
    - job: verify-exposure
      artifacts: false
    - job: verify-attestation
      artifacts: false
  variables:
    UNSPOOL_SOURCE_SHA: $CI_COMMIT_SHA
  trigger:
    project: azharizz/unspool-site
    branch: main
    strategy: depend
  environment:
    name: production
    url: https://unspool-site-1032c3.gitlab.io
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

production-smoke:
  stage: monitor
  image: python:3.12-slim
  needs: [deploy-pages]
  script:
    - python -m unspool.smoke --url https://unspool-site-1032c3.gitlab.io --commit "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy-cloud-run:
  stage: deploy
  image: google/cloud-sdk:slim
  interruptible: false
  resource_group: cloud-run-production
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://gitlab.com
  needs:
    - job: verify-exposure
      artifacts: true
    - job: verify-attestation
      artifacts: false
  script:
    - bash deploy/cloudrun/deploy.sh
  environment:
    name: production-gcp
    url: https://unspool-398376578726.us-central1.run.app
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
