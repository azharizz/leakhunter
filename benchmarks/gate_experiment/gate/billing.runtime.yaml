version: 1
cases:
- id: charge
  module: billing.service
  callable: charge
  args:
  - &id001
    payment_id: p-1
    amount: 25
    currency: EUR
    card_number: SYNTHETIC_GX_CARD_4d21
    cvv: SYNTHETIC_GX_CVV_83f0
    api_token: SYNTHETIC_GX_PAYTOKEN_6e1b
  kwargs: {}
  sensitive:
  - marker: SYNTHETIC_GX_CARD_4d21
    class: SECRET
    symbol: payment.card_number
  - marker: SYNTHETIC_GX_CVV_83f0
    class: SECRET
    symbol: payment.cvv
  - marker: SYNTHETIC_GX_PAYTOKEN_6e1b
    class: SECRET
    symbol: payment.api_token
  context:
    synthetic: true
  expect:
    payment_id: p-1
    status: charged
  finding:
    file: billing/service.py
    function: charge
    sink: HTTP_RESPONSE
- id: notify
  module: billing.service
  callable: notify
  args:
  - *id001
  kwargs: {}
  sensitive:
  - marker: SYNTHETIC_GX_CARD_4d21
    class: SECRET
    symbol: payment.card_number
  - marker: SYNTHETIC_GX_CVV_83f0
    class: SECRET
    symbol: payment.cvv
  - marker: SYNTHETIC_GX_PAYTOKEN_6e1b
    class: SECRET
    symbol: payment.api_token
  context:
    synthetic: true
  expect:
    notified: true
  finding:
    file: billing/service.py
    function: notify
    sink: WEBHOOK
  capture_http:
  - url_prefix: https://hooks.example.invalid/
    sink: WEBHOOK
