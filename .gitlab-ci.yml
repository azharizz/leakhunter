stages: [verify, evidence, deploy, monitor]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true

.python-bootstrap:
  before_script:
    - python -m pip install --disable-pip-version-check --upgrade -r requirements.build.lock

python-tests:
  extends: .python-bootstrap
  stage: verify
  image: python:3.12
  script:
    - pip install --disable-pip-version-check -c requirements.lock .
    - python -m unittest discover -s tests -v

dashboard-tests:
  stage: verify
  image: node:22-slim
  script:
    - node --check leakhunter/static/app.js
    - node tests/test_dashboard.cjs

security-audit:
  extends: .python-bootstrap
  stage: verify
  image: python:3.12-slim
  script:
    - python -m pip install --disable-pip-version-check -c requirements.build.lock -r requirements.audit.lock
    - python ci/security_audit.py
  artifacts:
    when: always
    paths: [security-reports/]
    expire_in: 90 days

installed-wheel:
  extends: .python-bootstrap
  stage: verify
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ['3.10', '3.12']
  script:
    - python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .
    - python -m pip install --disable-pip-version-check -c requirements.lock dist/unspool-*.whl
    - python -m pip check
    - cd /tmp
    - python -I "$CI_PROJECT_DIR/ci/verify_install.py" --source "$CI_PROJECT_DIR" --output "$CI_PROJECT_DIR/installation.json"
    - python -m pip freeze > "$CI_PROJECT_DIR/installed-dependencies.txt"
    - sha256sum "$CI_PROJECT_DIR"/dist/*.whl > "$CI_PROJECT_DIR/wheel-sha256.txt"
  artifacts:
    when: always
    paths: [dist/, installation.json, installed-dependencies.txt, wheel-sha256.txt]
    expire_in: 90 days

verify-exposure:
  extends: .python-bootstrap
  stage: evidence
  image: python:3.12-slim
  script:
    - pip install --disable-pip-version-check -c requirements.lock .
    # Only the committed synthetic target is executed in this disposable CI container.
    - python -m unspool --repository demo/target --policy demo/policy.yaml --runtime-manifest demo/runtime.yaml --runtime-backend local --data-dir /tmp/unspool-demo --provider-url '' --once analyze --gate > evidence.json
    - python -m unspool.publish --evidence evidence.json --output public --commit "$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths: [evidence.json, public/]
    expire_in: 90 days

deploy-pages:
  stage: deploy
  interruptible: false
  resource_group: production
  needs:
    - job: verify-exposure
      artifacts: false
  variables:
    UNSPOOL_SOURCE_SHA: $CI_COMMIT_SHA
  trigger:
    project: azharizz/unspool-site
    branch: main
    strategy: depend
  environment:
    name: production
    url: https://unspool-site-1032c3.gitlab.io
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

production-smoke:
  stage: monitor
  image: python:3.12-slim
  needs: [deploy-pages]
  script:
    - python -m unspool.smoke --url https://unspool-site-1032c3.gitlab.io --commit "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy-cloud-run:
  stage: deploy
  image: google/cloud-sdk:slim
  interruptible: false
  resource_group: cloud-run-production
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://gitlab.com
  needs:
    - job: verify-exposure
      artifacts: true
  script:
    - bash deploy/cloudrun/deploy.sh
  environment:
    name: production-gcp
    url: https://unspool-398376578726.us-central1.run.app
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
