  - marker: SYNTHETIC_GX_APITOKEN_0f4c
    class: SECRET
    symbol: user.api_token
  - marker: SYNTHETIC_GX_EMAIL_c2d7
    class: PII
    symbol: user.email
  - marker: SYNTHETIC_GX_BILLING_77b0
